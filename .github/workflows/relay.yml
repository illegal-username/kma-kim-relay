name: KIM relay

# Every 30 minutes: fetch what the newest KIM cycle still lacks (leads, or fields that
# failed). KIM's +0 h appears about 4-5 h after the cycle and a whole cycle takes about
# 25 minutes; a run with nothing to do takes seconds. Runs queue, never overlap.
on:
  schedule:
    - cron: "17,47 * * * *"
  workflow_dispatch:
    inputs:
      cycle:
        description: "YYYYMMDDHH (empty: newest)"
        required: false
      leads:
        description: "comma separated leads (empty: 0-48 h)"
        required: false

permissions:
  contents: write

concurrency:
  group: kim-relay
  cancel-in-progress: false

jobs:
  relay:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install --quiet numpy
      - name: Fetch and publish
        env:
          KMA_API_KEY: ${{ secrets.KMA_API_KEY }}
          GH_TOKEN: ${{ github.token }}
          CYCLE: ${{ inputs.cycle }}
          LEADS: ${{ inputs.leads }}
        run: python kim_relay.py ${CYCLE:+--cycle "$CYCLE"} ${LEADS:+--leads "$LEADS"}
      # GitHub stops the schedule of a public repository after 60 days without commits.
      - name: Keep the schedule alive
        run: |
          last=$(git log -1 --format=%ct)
          if [ $(( $(date +%s) - last )) -gt $(( 45 * 86400 )) ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "Keep the hourly schedule alive"
            git push
          fi
