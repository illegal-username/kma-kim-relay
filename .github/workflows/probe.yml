name: KIM relay probe

# Feasibility check: does the KMA API answer a GitHub-hosted runner, and how fast?
# Run by hand from the Actions tab.
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Probe KMA API
        env:
          KMA_API_KEY: ${{ secrets.KMA_API_KEY }}
        run: python3 probe_kma.py
